  var h='<div class="top"><button class="x" onclick="home()" aria-label="Back to home">←</button><p class="hi">Week at a glance</p><span></span></div>';
  h+='<p style="color:var(--mute);margin:0 0 4px">'+esc(S.name)+'’s last 7 days</p><div class="tiles"><div class="tile"><b>'+t.act+'/7</b><span>Days studied</span></div><div class="tile"><b>'+t.q+'</b><span>Questions</span></div><div class="tile"><b>'+pct([t.c,t.q])+'</b><span>Accuracy</span></div></div>';
  h+='<div class="card"><div class="wk">'+t.days.map(function(x){return '<div class="c"><div class="b'+(x.on?' on':'')+'" style="height:'+Math.max(6,x.xp/mx*100)+'%" title="'+x.xp+' XP"></div>'+(x.on?'🔥':x.fr?'❄️':' ')+'<br>'+x.n+'</div>'}).join('')+'</div></div>';
  if(S.rounds>0&&t.q===0)h+='<p class="info">Question-level numbers start from this update. Days studied and XP are accurate for the whole week.</p>';
  h+='<h3>By section</h3><div class="card"><div class="stat"><span>➗ Math</span><span>'+pct(t.m)+' ('+t.m[1]+' answered)</span></div><div class="stat"><span>📖 Reading &amp; Writing</span><span>'+pct(t.rw)+' ('+t.rw[1]+' answered)</span></div><p class="info">'+esc(focusLine(t))+'</p></div>';
  h+='<h3>Habit</h3><div class="card"><div class="stat"><span>🔥 Current streak</span><span>'+st+(st===1?' day':' days')+'</span></div><div class="stat"><span>🏆 Best streak</span><span>'+S.best+'</span></div><div class="stat"><span>❄️ Streak freezes</span><span>'+S.fz+'</span></div><div class="stat"><span>🎖️ Badges</span><span>'+Object.keys(S.bd).length+'/'+BADGES.length+'</span></div><p class="info">'+esc(tipLine(t))+'</p></div>';
  h+='<h3>Due for review ('+dueN()+')</h3><div class="card">'+(wrong?'<ul style="margin:0;padding-left:20px">'+wrong+'</ul>':'<p class="info" style="margin:0">All caught up. Nothing is waiting for review.</p>')+'</div>';
  h+='<div style="height:18px"></div><button class="btn" id="shb" onclick="shareSummary()">Share this summary</button><details style="margin-top:14px"><summary style="cursor:pointer;color:var(--mute)">Preview message</summary><pre class="pre">'+esc(summaryText())+'</pre></details>';
  return h;
}
function vHome(){
  var t=today(),xpT=S.days[t]||0,p=Math.min(1,xpT/GOAL),C=2*Math.PI*38,st=streak(),lv=Math.floor(S.xp/100)+1,lp=S.xp%100;
  var wk="",d=new Date();d.setDate(d.getDate()-6);
  for(var i=0;i<7;i++){var k=key(d),on=!!S.days[k],fr=!on&&!!S.frozen[k],now=k===t;wk+='<div class="day">'+d.toLocaleDateString(undefined,{weekday:"narrow"})+'<div class="dot'+(on||fr?" on":"")+(now?" now":"")+'">'+(on?"🔥":fr?"❄️":"")+'</div></div>';d.setDate(d.getDate()+1)}
  var missed=Object.keys(S.seen).filter(function(i){return due(+i)}).length;
  var h='<div class="top"><p class="hi">Hey '+esc(S.name)+' 👋</p><span class="chip"><span class="flame">🔥</span>'+st+(S.fz?' <span title="Streak freezes">❄️'+S.fz+'</span>':'')+'</span></div>';
  h+='<div class="say"><button class="mbtn" onclick="poke()" aria-label="Tap Pip for a tip">'+mascot("happy",76,"pip")+'</button><div class="bub" id="say">'+msg()+'</div></div>';
  h+='<div class="hero"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92" style="--c:'+C+'"><circle cx="46" cy="46" r="38" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="11"/><circle cx="46" cy="46" r="38" fill="none" stroke="#FFB800" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p))+'"/></svg><b>'+(xpT>=GOAL?"✓":xpT+"/"+GOAL)+'</b></div><div><h2>'+(xpT>=GOAL?"Goal crushed!":"Today’s 2-minute round")+'</h2><p>'+(xpT>=GOAL?"Keep going for bonus XP.":"5 questions keeps your streak alive.")+'</p></div></div>';
  h+='<div class="week">'+wk+'</div>';
  h+='<button class="btn" onclick="start(\'mix\')">'+(xpT>=GOAL?"Play another round":"Start today’s round")+'</button>';
  h+='<h3>Difficulty <span style="font-weight:400;color:var(--mute);font-size:.9rem">(adjusts as you play)</span></h3><div class="cl">'+[1,2,3].map(function(n){return '<button class="'+(S.tier===n?'on':'')+'" onclick="setTier('+n+')">'+TN[n]+'</button>'}).join('')+'</div><h3>Pick your focus</h3><div class="modes">';
  ["m","rw","pas","gr","rev","hard"].forEach(function(k){var m=MODES[k];h+='<button class="mode" onclick="start(\''+k+'\')"><span class="e">'+m[0]+'</span><br>'+m[1]+'<small>'+(k==="rev"?(missed?missed+" due for review":"All caught up"):m[2])+'</small></button>'});
  h+='</div>';
  h+='<h3>Your level</h3><div class="card"><div class="stat"><span>Level '+lv+'</span><span>'+S.xp+' XP</span></div><div class="bar"><i style="width:'+lp+'%"></i></div>';
  h+='<div class="stat" style="margin-top:16px"><span>➗ Math accuracy</span><span>'+pct(S.cat.m)+'</span></div><div class="stat"><span>📖 Reading &amp; Writing</span><span>'+pct(S.cat.rw)+'</span></div><div class="stat"><span>🏁 Rounds finished</span><span>'+S.rounds+'</span></div></div>';
  var ob=BADGES.filter(function(b){return S.bd[b[0]]}).length;
  h+='<h3>Badges ('+ob+'/'+BADGES.length+')</h3><div class="card"><div class="bgs">'+BADGES.map(function(b,i){return '<button class="bg'+(S.bd[b[0]]?'':' lock')+'" onclick="bdinfo('+i+')" aria-label="'+b[2]+'">'+b[1]+'</button>'}).join('')+'</div><p class="info" id="bi">Tap a badge to see how to earn it.</p></div>';
  h+='<h3>Pip’s closet</h3><div class="card"><div class="cl">'+OUT.map(function(o,i){var un=S.best>=o[2];return '<button class="'+(S.outfit===o[0]?'on':'')+'" '+(un?'':'disabled')+' onclick="wear('+i+')">'+o[1]+(un?'':' · '+o[2]+'-day streak')+'</button>'}).join('')+'</div></div>';
  h+='<button class="mode" style="width:100%;text-align:center;margin-top:18px" onclick="showParent()">👪 Weekly summary for parents</button>';
  h+='<button class="link" onclick="reset()">Reset progress</button>';
  return h;
}
function vRound(){
  var it=R.items[R.n],q=Q[it.i],L="ABCD",h='<div class="top"><button class="x" onclick="home()" aria-label="Quit round">✕</button><div class="prog bar"><i class="'+(R.done?"gr":"")+'" style="--f:'+(R.n/LEN*100)+'%;width:'+((R.n+(R.done?1:0))/LEN*100)+'%"></i></div><span class="chip">'+(R.n+1)+'/'+LEN+'</span></div>';
  h+='<div class="card'+(R.fresh?' enter':'')+'"><span class="tag">'+(q.c==="m"?"Math":"Reading &amp; Writing")+" ("+TN[lv(it.i)]+")</span>"+(q.p?'<div class="pass">'+esc(q.p)+'</div>':'')+(q.g?gfx(q.g):'')+'<p class="q">'+esc(q.q)+'</p><div class="opts">';
  it.order.forEach(function(oi,k){
    var c="opt";
    if(R.done){if(oi===q.a)c+=" right";else if(k===R.sel)c+=" wrong"}else if(k===R.sel)c+=" sel";
    h+='<button class="'+c+'" onclick="pickOpt('+k+')"><span class="l">'+L[k]+'</span><span>'+esc(q.o[oi])+'</span></button>';
  });
  h+='</div>';
  if(R.done){
    if(R.ok)h+='<span class="xpf">+10</span>';var good=["Nice one!","Nailed it!","Yes! Keep it rolling.","Sharp thinking!"][Math.floor(Math.random()*4)];
    h+='<div class="fb '+(R.ok?"ok":"bad")+'" style="display:flex;gap:12px;align-items:center">'+mascot(R.ok?"cheer":"oops",58)+'<div><b>'+(R.ok?"✓ "+good+" +10 XP":"Not quite. +3 XP for trying")+'</b><p>'+esc(q.e)+'</p></div></div>';
    h+='<button class="btn '+(R.ok?"ok":"bad")+'" onclick="next()">'+(R.n<LEN-1?"Continue":"Finish round")+'</button>';
  }else h+='<button class="btn" '+(R.sel===null?"disabled":"")+' onclick="check()">Check answer</button>';
  return h+'</div>';
}
function vResult(){
  var msg=R.right===LEN?"Perfect round!":R.right>=4?"So close to perfect!":R.right>=2?"Solid work. It adds up.":"Tough set. Misses are how scores go up.";
  var emo=R.right===LEN?"🏆":R.right>=4?"🎉":R.right>=2?"💪":"🌱";
  var h='<div class="res"><div class="big">'+mascot(R.right===LEN?"wow":R.right>=3?"cheer":R.right>=2?"happy":"oops",120)+'</div><h1>'+msg+'</h1><p style="color:var(--mute);margin:0">'+(R.newDay?"Streak extended to "+R.streak+(R.streak===1?" day":" days")+" 🔥":"You’re on a "+R.streak+"-day streak 🔥")+'</p>';
  if(R.tm)h+='<div class="lvl">'+R.tm+'</div>';R.nb.forEach(function(b){h+='<div class="lvl">'+b[1]+' New badge: '+b[2]+'</div>'});if(R.gotFz)h+='<div class="lvl">❄️ You earned a streak freeze!</div>';if(R.newDay&&[7,14,30].indexOf(R.streak)>-1)h+='<div class="lvl">🎁 New outfit for Pip unlocked!</div>';if(R.lvUp)h+='<div class="lvl">⬆️ Level up! You’re now level '+(Math.floor(S.xp/100)+1)+'</div>';h+='<div class="tiles"><div class="tile"><b>'+R.right+'/'+LEN+'</b><span>Correct</span></div><div class="tile"><b>+<span data-n="'+R.gain+'">0</span></b><span>XP earned</span></div><div class="tile"><b>'+(Math.floor(S.xp/100)+1)+'</b><span>Level</span></div></div>';
  h+='<button class="btn" onclick="start(\''+R.mode+'\')">One more round</button><div style="height:14px"></div><button class="mode" style="width:100%;text-align:center" onclick="home()">Back home</button></div>';
  return h;
}
function vWelcome(){
  return '<div class="res" style="padding-top:40px"><div class="big">'+mascot("happy",130)+'</div><h1>SAT Daily</h1><p style="color:var(--mute)">Hi, I’m Pip, your study buddy. Five questions a day. Build a streak. Watch your score climb.</p><label for="nm" style="display:block;text-align:left;font-weight:600;margin-top:20px">What should we call you?</label><input id="nm" maxlength="20" autocomplete="off" placeholder="Your name"><button class="btn" onclick="setName()">Let’s go</button></div>';
}
function render(){
  var a=document.getElementById("app");
  a.innerHTML=!S.name?vWelcome():screen==="round"?vRound():screen==="result"?vResult():screen==="parent"?vParent():vHome();
  a.className=S.name&&screen==="home"?"home":"";
  if(R)R.fresh=false;
  document.querySelectorAll("[data-n]").forEach(function(e){var n=+e.dataset.n,t0=null;function f(t){t0=t0||t;var p=Math.min(1,(t-t0)/800);e.textContent=Math.round(n*p);if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)});
  window.scrollTo(0,0);
}
load();render();
</script>
</body>
</html>
